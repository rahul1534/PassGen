name: Security & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install tools
        run: |
          set -e
          # gosec
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # govulncheck
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # staticcheck
          go install honnef.co/go/tools/cmd/staticcheck@latest
          # gitleaks (for secrets)
          curl -sSfL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin gitleaks

      - name: Run gosec
        run: |
          echo "==== gosec ===="
          gosec ./... | tee gosec-report.txt

      - name: Run govulncheck
        run: |
          echo "==== govulncheck ===="
          govulncheck ./... | tee govulncheck-report.txt

      - name: Run staticcheck
        run: |
          echo "==== staticcheck ===="
          staticcheck ./... | tee staticcheck-report.txt

      - name: go vet and tests with race
        run: |
          echo "==== go vet ===="
          go vet ./... || true
          echo "==== go test -race ===="
          go test -race ./... || true

      - name: gitleaks secret scan
        run: |
          echo "==== gitleaks ===="
          gitleaks detect --source . || true

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-logs
          path: |
            gosec-report.txt
            govulncheck-report.txt
            staticcheck-report.txt

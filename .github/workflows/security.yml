name: Security & Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install tools
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # BLOCKING: known-vulnerable dependencies / stdlib usage fail the build.
      - name: govulncheck
        shell: bash
        run: govulncheck ./... | tee govulncheck-report.txt

      # ADVISORY: findings are recorded in the uploaded report but do not fail
      # the build until the baseline has been triaged. Remove
      # `continue-on-error` from these two steps once the first run is clean.
      - name: gosec (advisory)
        continue-on-error: true
        shell: bash
        run: gosec ./... | tee gosec-report.txt

      - name: staticcheck (advisory)
        continue-on-error: true
        shell: bash
        run: staticcheck ./... 2>&1 | tee staticcheck-report.txt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-reports
          if-no-files-found: ignore
          path: |
            govulncheck-report.txt
            gosec-report.txt
            staticcheck-report.txt

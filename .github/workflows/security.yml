name: Security & Static Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Debug: list workspace"
        run: |
          pwd
          ls -la
          git rev-parse --abbrev-ref HEAD || true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install tools
        shell: bash
        run: |
          set -xeo pipefail
          # capture all output to install-tools.log for diagnosis
          exec > >(tee install-tools.log) 2>&1

          # ensure GOPATH/bin is in PATH after installs (actions/setup-go sets GOPATH)
          export GOPATH=$(go env GOPATH)
          mkdir -p "${GOPATH}/bin"
          export GOBIN="${GOPATH}/bin"
          export PATH="${PATH}:${GOBIN}"

          echo "GOPATH=$GOPATH"
          echo "GOBIN=$GOBIN"
          echo "PATH=$PATH"

          # Install gosec, govulncheck, staticcheck
          GO111MODULE=on go install github.com/securego/gosec/v2/cmd/gosec@latest
          GO111MODULE=on go install golang.org/x/vuln/cmd/govulncheck@latest
          GO111MODULE=on go install honnef.co/go/tools/cmd/staticcheck@latest

          # Install gitleaks via go install (safe and puts binary in GOBIN)
          GO111MODULE=on go install github.com/zricethezav/gitleaks/v8@latest

          # Verify tool versions / existence
          which gosec || true
          which govulncheck || true
          which staticcheck || true
          which gitleaks || true

      - name: Run gosec
        shell: bash
        run: |
          set -xeo pipefail
          echo "==== gosec ====" > gosec-report.txt
          if gosec ./... | tee -a gosec-report.txt; then
            echo "gosec succeeded" >> gosec-report.txt
          else
            echo "gosec failed (non-zero exit)" >> gosec-report.txt
            true # don't fail the whole workflow yet; we want to upload the report
          fi

      - name: Run govulncheck
        shell: bash
        run: |
          set -xeo pipefail
          echo "==== govulncheck ====" > govulncheck-report.txt
          if govulncheck ./... | tee -a govulncheck-report.txt; then
            echo "govulncheck succeeded" >> govulncheck-report.txt
          else
            echo "govulncheck failed (non-zero exit)" >> govulncheck-report.txt
            true
          fi

      - name: Run staticcheck
        shell: bash
        run: |
          set -xeo pipefail
          echo "==== staticcheck ====" > staticcheck-report.txt
          if staticcheck ./... 2>&1 | tee -a staticcheck-report.txt; then
            echo "staticcheck succeeded" >> staticcheck-report.txt
          else
            echo "staticcheck failed (non-zero exit)" >> staticcheck-report.txt
            true
          fi

      - name: go vet and tests with race
        shell: bash
        run: |
          set -xeo pipefail
          echo "==== go vet ====" > govet-report.txt
          if go vet ./... 2>&1 | tee -a govet-report.txt; then
            echo "go vet succeeded" >> govet-report.txt
          else
            echo "go vet failed (non-zero exit)" >> govet-report.txt
            true
          fi

          echo "==== go test -race ====" > gotest-race-report.txt
          if go test -race ./... 2>&1 | tee -a gotest-race-report.txt; then
            echo "go test -race succeeded" >> gotest-race-report.txt
          else
            echo "go test -race failed (non-zero exit)" >> gotest-race-report.txt
            true
          fi

      - name: "Debug: list reports"
        run: |
          echo "=== workspace listing ==="
          ls -la
          echo "=== tool binaries in PATH ==="
          which gosec || true
          which govulncheck || true
          which staticcheck || true
          which gitleaks || true

      - name: Upload reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-logs
          path: |
            install-tools.log
            gosec-report.txt
            govulncheck-report.txt
            staticcheck-report.txt
            govet-report.txt
            gotest-race-report.txt
            gitleaks-report.txt
